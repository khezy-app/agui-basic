services:
  backend:
    image: agui-backend:latest
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://host.docker.internal:11434/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gemma4:e4b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-dummy}

  frontend:
    image: agui-frontend:latest
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_AGUI_URL: ${VITE_AGUI_URL:-/agent}
        VITE_AGUI_ENABLED: ${VITE_AGUI_ENABLED:-true}
    ports:
      - "5173:80"
    depends_on:
      - backend
